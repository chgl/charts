spark:
  cluster:
    executor:
      instances: 1
      podTemplate:
        apiVersion: v1
        kind: Pod
        spec:
          containers:
            - name: spark-kubernetes-executor
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                privileged: false
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 65534
                runAsGroup: 65534
                seccompProfile:
                  type: RuntimeDefault
