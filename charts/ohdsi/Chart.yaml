apiVersion: v2
name: ohdsi
description: A Helm chart for deploying the OHDSI stack consisting of Atlas, WebAPI, and Achilles as a cron job.
type: application
home: https://github.com/OHDSI
keywords:
  - ohdsi
  - health care
  - research
sources:
  - https://github.com/OHDSI/Atlas3
  - https://github.com/OHDSI/WebAPI
  - https://github.com/OHDSI/Broadsea-Achilles
maintainers:
  - name: chgl
dependencies:
  - name: postgres
    version: 0.22.0
    repository: oci://registry-1.docker.io/cloudpirates
    condition: postgres.enabled
  - name: common
    repository: oci://ghcr.io/chgl/charts
    version: 0.1.1
icon: https://avatars.githubusercontent.com/u/6570077
deprecated: false
kubeVersion: ">= 1.21.0-0"
version: 0.26.0
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/helm/cloudpirates-postgres/postgres
  artifacthub.io/links: |
    - name: OHDSI Homepage
      url: https://www.ohdsi.org/
  artifacthub.io/screenshots: |
    - title: Defining a cohort in OHDSI ATLAS
      url: https://ohdsi.github.io/TheBookOfOhdsi/images/OhdsiAnalyticsTools/atlas.png
    - title: OHDSI ACHILLES Dashboard
      url: https://www.ohdsi.org/wp-content/uploads/2020/06/Screen-Shot-2020-06-01-at-3.31.29-PM.png
  artifacthub.io/changes: |-
    # When using the list of objects option the valid supported kinds are
    # added, changed, deprecated, removed, fixed and security.
    - kind: changed
      description: "BREAKING: updated the OHDSI WebAPI to v3.0.1. See the README for details."
    - kind: changed
      description: "BREAKING: replaced the legacy OHDSI ATLAS with ATLAS 3 (ghcr.io/ohdsi/atlas3:3.0.1). `atlas.config.local` now expects a `config-local.json`."
    - kind: removed
      description: "BREAKING: removed `atlas.constructWebApiUrlFromIngress`, `webApi.auth.basic.query`, `webApi.auth.openid.callbackApi`, and `webApi.auth.openid.redirectUrl`."
    - kind: added
      description: "Added `webApi.auth.jwt` and `webApi.auth.adminLogins` settings and `loadCohortDefinitionsJob.auth` to authenticate the cohort definition loader."
    - kind: changed
      description: "Replaced the default `cdmInitJob.image` `docker/whalesay` with `busybox`."
    - kind: fixed
      description: "Annotations of the cdm-init and load-cohortdefinitions jobs were rendered as labels."
    - kind: changed
      description: "BREAKING: the cdm-init and load-cohortdefinitions jobs now run as Helm hooks; cohort definitions are only loaded if their name doesn't exist yet."
    - kind: removed
      description: "BREAKING: removed the non-functional `webApi.metrics.serviceMonitor` and the unused `webApi.cors.enabled`."
    - kind: fixed
      description: "Fixed ServiceAccount names, the missing Achilles ServiceAccount, and the NOTES.txt URLs."
    - kind: changed
      description: "BREAKING: `achilles.enabled` defaults to `false`, `commonAnnotations` is a map, and Kubernetes 1.21+ is required."
    - kind: added
      description: "Added a values.schema.json and `ingress.ingressClassName`."
