postgres:
  auth:
    postgresPassword: "ohdsi-pg-pw"
  initdb:
    scripts:
      00-init-db-auth-users.sql: |
        -- the WebAPI database authentication users are kept in a separate schema
        -- so the WebAPI's Flyway migrations still run against an empty `ohdsi` schema
        CREATE SCHEMA IF NOT EXISTS webapi_security;
        CREATE TABLE IF NOT EXISTS webapi_security.auth_user (
          login           VARCHAR(100) PRIMARY KEY,
          password_hash   VARCHAR(255) NOT NULL,
          first_name      VARCHAR(100) NULL,
          middle_name     VARCHAR(100) NULL,
          last_name       VARCHAR(100) NULL,
          enabled         BOOLEAN      NOT NULL DEFAULT TRUE,
          failed_attempts INT          NOT NULL DEFAULT 0,
          locked_until    TIMESTAMP    NULL
        );
        INSERT INTO webapi_security.auth_user (login, password_hash, first_name, last_name)
        VALUES ('ci-admin', '{noop}ci-admin', 'CI', 'Admin')
        ON CONFLICT DO NOTHING;

cdmInitJob:
  enabled: true

webApi:
  podDisruptionBudget:
    enabled: true
  db:
    schema: ohdsi
  auth:
    basic:
      enabled: true
      schema: webapi_security
    adminLogins: "ci-admin"
    openid:
      # WebAPI v3 resolves the OIDC issuer at startup, so this can only be enabled with a reachable provider
      enabled: false
      clientId: "ohdsi"
      clientSecret: "a5f55a03-ca7d-4a52-a352-498defb2f6fa" # betterleaks:allow
      oidUrl: "https://auth.example.com/auth/realms/OHDSI/.well-known/openid-configuration"
  extraEnv:
    - name: "JAVA_OPTS"
      value: "-XX:MinRAMPercentage=60.0 -XX:MaxRAMPercentage=80.0"
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: webapi

achilles:
  # only rendered, the CronJob won't run during the test
  enabled: true

ingress:
  enabled: true

atlas:
  replicaCount: 2
  podDisruptionBudget:
    enabled: true
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: atlas
  config:
    local: |
      {
        "api": { "url": "/WebAPI" },
        "userAuthenticationEnabled": true,
        "enableSkipLogin": true,
        "enablePermissionManagement": true
      }

