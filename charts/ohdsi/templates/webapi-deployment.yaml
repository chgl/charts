{{- with .Values.webApi }}
{{- if .enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ohdsi.fullname" $ }}-webapi
  labels:
    {{- include "ohdsi.labels" $ | nindent 4 }}
    app.kubernetes.io/component: webapi
  {{- with $.Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .replicaCount }}
  selector:
    matchLabels:
      {{- include "ohdsi.matchLabels" $ | nindent 6 }}
      app.kubernetes.io/component: webapi
  template:
    metadata:
    {{- with .podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      labels:
        {{- include "ohdsi.labels" $ | nindent 8 }}
        app.kubernetes.io/component: webapi
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ohdsi.webApi.serviceAccountName" $ }}
      automountServiceAccountToken: {{ .serviceAccount.automountServiceAccountToken }}
      initContainers:
        - name: wait-for-db
          image: {{ include "ohdsi.webapi.waitForDatabaseInitContainerImage" $ }}
          imagePullPolicy: {{ .waitForDatabaseInitContainer.image.pullPolicy }}
          {{- with $.Values.restrictedContainerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if $.Values.initContainers.resources }}
          resources: {{- toYaml $.Values.initContainers.resources | nindent 12 }}
          {{- else if ne $.Values.initContainers.resourcesPreset "none" }}
          resources: {{- include "common.resources.preset" (dict "type" $.Values.initContainers.resourcesPreset) | nindent 12 }}
          {{- end }}
          env:
            - name: PGHOST
              value: {{ include "ohdsi.database.host" $ | quote }}
            - name: PGPORT
              value: {{ include "ohdsi.database.port" $ | quote }}
            - name: PGUSER
              value: {{ include "ohdsi.database.user" $ | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              until pg_isready; do
                echo "Waiting for DB ${PGUSER}@${PGHOST}:${PGPORT} to be up";
                sleep 15;
              done;
      containers:
        - name: webapi
          {{- with .securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .image.registry }}/{{ .image.repository }}:{{ .image.tag }}"
          imagePullPolicy: {{ .image.pullPolicy }}
          env:
            {{- /* WebAPI v3 always enforces the allowed origins, regardless of `security.cors.enabled` */}}
            {{- if (or .cors.allowedOrigin $.Values.ingress.enabled) }}
            - name: SECURITY_CORS_ALLOWED_ORIGINS
              value: {{ .cors.allowedOrigin | default (include "ohdsi.ingress.origin" $) | quote }}
            {{- end }}
            - name: DATASOURCE_DRIVERCLASSNAME
              value: org.postgresql.Driver
            - name: DATASOURCE_URL
              value: {{ include "ohdsi.webapi.jdbcUrl" $ | quote }}
            - name: DATASOURCE_USERNAME
              value: {{ include "ohdsi.database.user" $ | quote }}
            - name: DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ohdsi.webapi.db-secret-name" $ | quote }}
                  key: {{ include "ohdsi.webapi.db-secret-key" $ | quote }}
            - name: DATASOURCE_OHDSI_SCHEMA
              value: {{ .db.schema }}
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA
              value: {{ .db.schema }}
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT
              value: org.hibernate.dialect.PostgreSQLDialect
            - name: SPRING_BATCH_REPOSITORY_TABLEPREFIX
              value: {{ .db.schema }}.BATCH_
            - name: SPRING_FLYWAY_URL
              value: {{ include "ohdsi.webapi.jdbcUrl" $ | quote }}
            - name: SPRING_FLYWAY_USER
              value: {{ include "ohdsi.database.user" $ | quote }}
            - name: SPRING_FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ohdsi.webapi.db-secret-name" $ | quote }}
                  key: {{ include "ohdsi.webapi.db-secret-key" $ | quote }}
            - name: SPRING_FLYWAY_SCHEMAS
              value: {{ .db.schema }}
            - name: SPRING_FLYWAY_PLACEHOLDERS_OHDSISCHEMA
              value: {{ .db.schema }}
            - name: SECURITY_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "ohdsi.auth.jwt.secretName" $ | quote }}
                  key: {{ include "ohdsi.auth.jwt.secretKey" $ | quote }}
            {{- if .auth.adminLogins }}
            - name: SECURITY_ADMIN_LOGIN
              value: {{ .auth.adminLogins | quote }}
            {{- end }}
            {{- if .auth.openid.enabled }}
            - name: SECURITY_AUTH_OIDC_ENABLED
              value: "true"
            - name: SECURITY_AUTH_OIDC_CLIENTID
              value: {{ .auth.openid.clientId | quote }}
            - name: SECURITY_AUTH_OIDC_APISECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "ohdsi.auth.secretName" $ | quote }}
                  key: {{ include "ohdsi.auth.secretKey" $ | quote }}
            - name: SECURITY_AUTH_OIDC_URL
              value: {{ .auth.openid.oidUrl | quote }}
            - name: SECURITY_AUTH_OAUTH_CALLBACK_UI
              value: {{ include "ohdsi.oauth.callback.ui" $ | quote }}
            {{- with .auth.openid.logoutUrl }}
            - name: SECURITY_AUTH_OIDC_LOGOUTURL
              value: {{ . | quote }}
            {{- end }}
            {{- with .auth.openid.rolesClaim }}
            - name: SECURITY_AUTH_OIDC_ROLESCLAIM
              value: {{ . | quote }}
            {{- end }}
            {{- with .auth.openid.extraScopes }}
            - name: SECURITY_AUTH_OIDC_EXTRASCOPES
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if .auth.basic.enabled }}
            - name: SECURITY_AUTH_DB_ENABLED
              value: "true"
            - name: SECURITY_AUTH_DB_DATASOURCE_URL
              value: {{ include "ohdsi.webapi.jdbcUrl" $ | quote }}
            - name: SECURITY_AUTH_DB_DATASOURCE_DRIVER_CLASS_NAME
              value: "org.postgresql.Driver"
            - name: SECURITY_AUTH_DB_DATASOURCE_SCHEMA
              value: {{ default .db.schema .auth.basic.schema }}
            - name: SECURITY_AUTH_DB_DATASOURCE_USERNAME
              value: {{ include "ohdsi.database.user" $ | quote }}
            - name: SECURITY_AUTH_DB_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ohdsi.webapi.db-secret-name" $ | quote }}
                  key: {{ include "ohdsi.webapi.db-secret-key" $ | quote }}
            {{- end }}
          {{- if .extraEnv }}
          {{- toYaml .extraEnv | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- with .readinessProbe }}
          readinessProbe:
            httpGet:
              path: /WebAPI/info
              port: http
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
            successThreshold: {{ .successThreshold }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          {{- with .startupProbe }}
          startupProbe:
            httpGet:
              path: /WebAPI/info
              port: http
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
            successThreshold: {{ .successThreshold }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          {{- with .livenessProbe }}
          livenessProbe:
            httpGet:
              path: /WebAPI/info
              port: http
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
            successThreshold: {{ .successThreshold }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          {{- if .resources }}
          resources: {{- toYaml .resources | nindent 12 }}
          {{- else if ne .resourcesPreset "none" }}
          resources: {{- include "common.resources.preset" (dict "type" .resourcesPreset) | nindent 12 }}
          {{- end }}
          volumeMounts:
            - mountPath: /tmp
              name: tmp-volume
            - mountPath: /var/lib/ohdsi/webapi/logs
              name: logs-volume
            - mountPath: /var/lib/ohdsi/webapi/data
              name: data-volume
      {{- with .nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: tmp-volume
          emptyDir: {}
        - name: logs-volume
          emptyDir: {}
        - name: data-volume
          emptyDir: {}
{{- end }}
{{- end }}
