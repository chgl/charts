{{- if .Values.webApi.enabled }}
{{- $createOpenIdSecret := (and .Values.webApi.auth.openid.enabled (not .Values.webApi.auth.openid.existingSecret)) }}
{{- $createJwtSecret := (not .Values.webApi.auth.jwt.existingSecret) }}
{{- if (or $createOpenIdSecret $createJwtSecret) }}
{{- $secretName := printf "%s-webapi-auth" (include "ohdsi.fullname" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "ohdsi.labels" . | nindent 4 }}
    app.kubernetes.io/component: webapi
type: Opaque
data:
  {{- if $createOpenIdSecret }}
  webapi-openid-client-secret: {{ .Values.webApi.auth.openid.clientSecret | b64enc | quote }}
  {{- end }}
  {{- if $createJwtSecret }}
  {{- if .Values.webApi.auth.jwt.secret }}
  webapi-jwt-secret: {{ .Values.webApi.auth.jwt.secret | b64enc | quote }}
  {{- else }}
  {{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) }}
  {{- if (and $existing (hasKey $existing.data "webapi-jwt-secret")) }}
  webapi-jwt-secret: {{ index $existing.data "webapi-jwt-secret" | quote }}
  {{- else }}
  webapi-jwt-secret: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
